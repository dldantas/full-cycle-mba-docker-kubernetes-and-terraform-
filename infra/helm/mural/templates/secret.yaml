{{- /*
Credencial do banco. O valor NÃO está versionado: vem de --set / set_sensitive
(Terraform random_password) na instalação. A DATABASE_URL, que carrega a senha,
só existe aqui e é injetada na API via secretKeyRef.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $password := required "database.password é obrigatório (passe via --set/Terraform ou use database.existingSecret)" .Values.database.password }}
{{- $host := include "mural.postgres.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.secretName" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.database.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.database.name | b64enc | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" (.Values.database.user | urlquery) ($password | urlquery) $host .Values.database.port .Values.database.name | b64enc | quote }}
{{- end }}
